# name: ed-expansion

services:
    ed-expansion-api:
        container_name: ed-expansion-api
        # image: node:21-alpine
        image: node-express-ed
        build:
            context: .
            dockerfile: ./Dockerfile
        volumes:
            - ./assets:/usr/src/app/assets
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        ports:
            - 5000:5000
        mem_limit: 192M
        restart: unless-stopped
        logging:
            options:
                max-size: "10m"
                max-file: "3"

networks:
    default:
        name: proxylan
