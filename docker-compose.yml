name: ed-expansion

services:
    ed-expansion-api:
        container_name: ed-expansion-api
        # image: node:21-alpine
        image: node-express-ed
        build:
            context: .
            dockerfile: ./Dockerfile
        volumes:
            - ./assets:/usr/src/app/assets
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        ports:
            - 5000:5000
        restart: unless-stopped
        logging:
            options:
                max-size: "10m"
                max-file: "3"

        # Límite de memoria del contenedor. Heap de Node es 128MB; dejamos
        # margen para el RSS fuera del heap (buffers, binarios de V8, red).
        # Una vez optimizado el consumo, valorar bajar de nuevo.
        deploy:
            resources:
                limits:
                    memory: 256M

networks:
    default:
        name: proxylan
