name: ed-expansion

services:
    ed-expansion-api:
        container_name: ed-expansion-api
        # image: node:21-alpine
        image: node-express-ed
        build:
            context: .
            dockerfile: ./Dockerfile
        volumes:
            - ./assets:/usr/src/app/assets
            - /etc/timezone:/etc/timezone:ro
            - /etc/localtime:/etc/localtime:ro
        ports:
            - 5000:5000
        restart: unless-stopped
        logging:
            options:
                max-size: "10m"
                max-file: "3"

        # Heap de Node: 160MB (Dockerfile). 256M deja margen para el RSS fuera
        # del heap, de modo que el OOM de JS salta antes que el SIGKILL del kernel
        deploy:
            resources:
                limits:
                    memory: 256M

networks:
    default:
        name: proxylan
